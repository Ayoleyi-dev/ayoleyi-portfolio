name: Portfolio checks
on:
  push:
    branches:
      - main
      - 'portfolio/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check content, local assets and project links
        run: npm run check:content
      - name: Build production site
        run: npm run build
